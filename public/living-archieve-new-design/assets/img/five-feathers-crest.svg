<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Five Feathers Crest</title>
  <desc id="desc">A decorative five feathers crest placeholder in gold and copper.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="16" x2="208" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#2B1A10"/><stop offset="1" stop-color="#070706"/></linearGradient>
    <linearGradient id="gold" x1="62" y1="26" x2="178" y2="214" gradientUnits="userSpaceOnUse"><stop stop-color="#F1C76B"/><stop offset="1" stop-color="#B96F37"/></linearGradient>
    <filter id="shadow" x="-20" y="-20" width="280" height="280" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <circle cx="120" cy="120" r="112" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="120" cy="120" r="100" stroke="#D9A441" stroke-opacity=".65" stroke-width="2"/>
  <circle cx="120" cy="120" r="72" fill="#D9A441" fill-opacity=".08" stroke="#F1C76B" stroke-opacity=".30"/>
  <g transform="translate(120 110)">
    <rect x="-6" y="-82" width="12" height="80" rx="8" fill="url(#gold)" transform="rotate(-42)"/>
    <rect x="-6" y="-88" width="12" height="88" rx="8" fill="#D9A441" transform="rotate(-21)"/>
    <rect x="-6" y="-94" width="12" height="94" rx="8" fill="url(#gold)"/>
    <rect x="-6" y="-88" width="12" height="88" rx="8" fill="#D9A441" transform="rotate(21)"/>
    <rect x="-6" y="-82" width="12" height="80" rx="8" fill="url(#gold)" transform="rotate(42)"/>
  </g>
  <circle cx="120" cy="116" r="32" fill="url(#gold)"/>
  <text x="120" y="164" text-anchor="middle" fill="#FFF7E8" font-family="Georgia, serif" font-size="19" font-weight="700">Five</text>
  <text x="120" y="184" text-anchor="middle" fill="#FFF7E8" font-family="Georgia, serif" font-size="19" font-weight="700">Feathers</text>
</svg>
